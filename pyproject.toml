[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amadeus-counterpoint"
version = "0.1.0"
description = "Compositional behavioral modeling under unseen dyadic interaction."
requires-python = ">=3.11"
dependencies = [
    "python-chess",
    "torch",
    "pyarrow",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
